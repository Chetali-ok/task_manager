<div class="signup-wrapper d-flex align-items-center justify-content-center min-vh-100 px-3">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="signup-card shadow-sm p-4">
    <div class="text-center mb-4">
      <div class="brand-icon fs-1">📋</div>
      <h2 class="mt-3">Signup</h2>
      <p class="text-muted mb-0">Enter your details to create an account.</p>
    </div>

    <form (ngSubmit)="signup()" autocomplete="off" class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" name="username" type="text" class="form-control" placeholder="Your username" [(ngModel)]="username" required>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <input id="password" name="password" [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="Your password" [(ngModel)]="password" required>
          <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword" aria-label="Toggle password visibility">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 btn-primary-custom">Signup</button>
    </form>

    <div class="text-center mt-4">
      <p class="mb-0 text-muted">Already have an account? <a routerLink="/login" class="login-link">Login</a></p>
    </div>
  </div>
</div>
